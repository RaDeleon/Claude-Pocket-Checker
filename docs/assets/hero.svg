<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">Claude Pocket Checker — product illustration</title><desc id="desc">Illustrative product interface with synthetic data. Not a captured conversation or benchmark.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#27303c" stroke-width="1"/></pattern></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#eef2f8}.small{font-size:17px;fill:#b1bdcc}.body{font-size:21px}.mono{font-size:19px;font-family:ui-monospace,Menlo,monospace}.amber{fill:#f5b942}.recommend{font-size:29px;font-weight:700;fill:#8ee6c0}</style><rect width="1280" height="640" rx="24" fill="#10151e"/><rect width="1280" height="640" rx="24" fill="url(#grid)" opacity=".45"/><path d="M58 76h112" stroke="#f5b942" stroke-width="6"/><text x="58" y="125" class="small amber">ANGELO DE LEON / MACOS TOOLS</text><text x="54" y="249" font-size="62" font-weight="750" letter-spacing="-2">Claude Pocket</text><text x="54" y="321" font-size="62" font-weight="750" letter-spacing="-2">Checker</text><text x="58" y="386" font-size="22">Check the draft. Choose the model.</text><text x="58" y="448" class="small">Local observation. Explicit assumptions.</text><text x="58" y="480" class="small">Independent of the official Claude app.</text><rect x="58" y="526" width="370" height="38" rx="19" fill="#302b20"/><text x="78" y="551" class="small amber">ILLUSTRATION · SYNTHETIC DATA</text><rect x="660" y="85" width="570" height="500" rx="20" fill="#181e29" stroke="#3a4352"/><path d="M660 135h570" stroke="#3a4352"/><circle cx="687" cy="110" r="5" fill="#f5b942"/><circle cx="705" cy="110" r="5" fill="#5c6573"/><circle cx="723" cy="110" r="5" fill="#5c6573"/><text x="750" y="116" class="small">Independent floating panel</text><text x="690" y="177" class="body">Personal · Example accou